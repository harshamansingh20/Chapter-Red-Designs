<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro Preview — Chapter Red</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f0f0;
      font-family: -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── Overlay ── */
    #intro {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Logo ── */
    #intro-logo {
      width: min(540px, 72vw);
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1),
                  transform 0.9s cubic-bezier(0.16,1,0.3,1);
      position: relative;
      z-index: 2;
    }
    #intro-logo.show {
      opacity: 1;
      transform: scale(1.0);
    }

    /* make non-red paths white so logo reads on dark bg */
    #intro-logo path:not([fill]) { fill: #ffffff; }

    /* ── Red sweep (floods from bottom) ── */
    #intro-sweep {
      position: absolute;
      inset: 0;
      background: #e41e2f;
      transform: translateY(100%);
      transition: transform 0.55s cubic-bezier(0.76,0,0.24,1);
      z-index: 3;
    }
    #intro-sweep.flood {
      transform: translateY(0%);
    }

    /* ── Exit: entire overlay slides up ── */
    #intro {
      transition: transform 0.65s cubic-bezier(0.76,0,0.24,1),
                  opacity 0.4s ease;
    }
    #intro.exit {
      transform: translateY(-100%);
    }

    /* ── Replay button (shown when animation done) ── */
    #replay {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      translate: -50% 0;
      z-index: 200;
      background: #0a0a0a;
      color: #fff;
      border: none;
      padding: 0.7rem 1.6rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 100px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #replay.show {
      opacity: 1;
      pointer-events: auto;
    }
    #replay:hover { background: #e41e2f; }

    /* ── "Site revealed" label ── */
    #site-label {
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease 0.3s;
    }
    #site-label.show { opacity: 1; }
    #site-label h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      color: #121212;
      letter-spacing: -0.04em;
    }
    #site-label p {
      color: #888;
      font-size: 0.9375rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

    <!-- red flood panel -->
    <div id="intro-sweep"></div>
  </div>

  <button id="replay">↺ &nbsp;Replay</button>

  <script>
    const intro   = document.getElementById('intro');
    const logo    = document.getElementById('intro-logo');
    const sweep   = document.getElementById('intro-sweep');
    const replay  = document.getElementById('replay');
    const label   = document.getElementById('site-label');

    function run() {
      // reset
      intro.style.transform = '';
      intro.style.transition = 'none';
      logo.classList.remove('show');
      sweep.classList.remove('flood');
      sweep.style.transition = 'none';
      label.classList.remove('show');
      replay.classList.remove('show');

      // force reflow
      intro.offsetHeight;

      intro.style.transition = 'transform 0.65s cubic-bezier(0.76,0,0.24,1)';
      sweep.style.transition  = 'transform 0.55s cubic-bezier(0.76,0,0.24,1)';

      // phase 1 — logo in (after 400ms pause)
      setTimeout(() => logo.classList.add('show'), 400);

      // phase 2 — red floods up from bottom
      setTimeout(() => sweep.classList.add('flood'), 1800);

      // phase 3 — whole overlay slides up, revealing site
      setTimeout(() => {
        intro.style.transform = 'translateY(-100%)';
      }, 2500);

      // phase 4 — show site label + replay
      setTimeout(() => {
        label.classList.add('show');
        replay.classList.add('show');
      }, 3200);
    }

    replay.addEventListener('click', run);
    run();
  </script>
